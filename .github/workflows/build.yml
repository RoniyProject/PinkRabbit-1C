on:
  workflow_call:
    inputs:
      postfix:
        required: true
        type: string

env:
  # keep in sync with the release name in entry.yml
  VERSION: 2.3.0.${{github.run_number}}
  LINUX_DIR: linux/build
  LINUX_LIB: libPinkRabbitMQ64.so
  PKG_DIR: package
  WIN_DIR: windows

jobs:
  buildLinux:
    runs-on: ubuntu-22.04
    name: Linux ${{inputs.postfix}}
    services:
      rabbitmq:
        image: rabbitmq
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4.1.5

      - run: mkdir $LINUX_DIR

      - name: Configure CMake.
        working-directory: ${{env.LINUX_DIR}}
        run: cmake -DCMAKE_BUILD_TYPE=Release -DVERSION=${{env.VERSION}} -DNAME_POSTFIX=${{inputs.postfix}} ..

      - name: Build
        working-directory: ${{env.LINUX_DIR}}
        run: cmake --build .

      - if: ${{ inputs.postfix == '' }}
        run: python3 -m pip install pytest

      - name: Test
        if: ${{ inputs.postfix == '' }}
        # a test failure is shown in the run, but does not cancel the builds and the release
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ${{env.LINUX_DIR}}
        run: python3 -m pytest ../../test -v -rfE -p no:cacheprovider --junitxml=pytest-report.xml

      - name: Test report
        if: ${{ always() && inputs.postfix == '' }}
        working-directory: ${{env.LINUX_DIR}}
        run: python3 ../../.github/scripts/pytest_report.py pytest-report.xml

      - name: Upload Linux Library
        uses: actions/upload-artifact@v4.3.3
        with:
          name: ${{env.LINUX_LIB}}_${{inputs.postfix}}
          path: ${{env.LINUX_DIR}}/${{env.LINUX_LIB}}
          if-no-files-found: error
          retention-days: 1


  buildWindows:
    runs-on: windows-latest
    needs: [buildLinux]
    name: Windows ${{inputs.postfix}}

    steps:
      - uses: actions/checkout@v4.1.5

      - name: Download Linux Library
        uses: actions/download-artifact@v4.1.7
        with:
          name: ${{env.LINUX_LIB}}_${{inputs.postfix}}
          path: ${{env.PKG_DIR}}/

      - name: Remove Linux Artifact
        uses: GeekyEggo/delete-artifact@v5.0.0
        with:
          name: ${{env.LINUX_LIB}}_${{inputs.postfix}}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
    
      - name: Build
        working-directory: ${{env.WIN_DIR}}
        run: msbuild msbuild.xml -t:makeRelease -p:VERSION=${{env.VERSION}} -p:NAME_POSTFIX=${{inputs.postfix}}

      - name: Rename Build
        run: ren PinkRabbitMQ_v${{env.VERSION}}.zip PinkRabbitMQ${{inputs.postfix}}_v${{env.VERSION}}.zip

      # the release is created once by the release job of entry.yml after all builds
      - name: Upload Package
        uses: actions/upload-artifact@v4.3.3
        with:
          name: prmq-package${{inputs.postfix}}
          path: PinkRabbitMQ${{inputs.postfix}}_v${{env.VERSION}}.zip
          if-no-files-found: error
          retention-days: 1

